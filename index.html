<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: #1A2026;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .icon {
            width: 100px;
            height: 100px;
            margin-bottom: 25px;
            border: none;
            outline: none;
            box-shadow: none;
            object-fit: contain;
        }
        
        h1 {
            font-size: 26px;
            margin-bottom: 15px;
            color: #ffffff;
        }
        
        .description {
            font-size: 15px;
            color: #cccccc;
            margin-bottom: 30px;
            max-width: 280px;
            line-height: 1.5;
        }
        
        .continue-btn {
            background-color: #242D36;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }
        
        .continue-btn:hover {
            background-color: #2F3A44;
        }
        
        .telegram-indicator {
            margin-top: 20px;
            font-size: 12px;
            color: #248bda;
            padding: 6px 12px;
            background-color: rgba(36, 139, 218, 0.1);
            border-radius: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <img src="icon.gif" alt="" class="icon" id="userIcon">
    
    <h1 id="welcomeText">Загрузка...</h1>
    
    <div class="description" id="descriptionText">
        Подготовка приложения...
    </div>
    
    <button class="continue-btn" id="continueButton">
        Продолжить
    </button>
    
    <div class="telegram-indicator" id="telegramIndicator">
        Telegram Mini App
    </div>

    <script>
        // Проверяем, запущено ли в Telegram Mini App
        function isTelegramWebApp() {
            // Проверка 1: Наличие объекта Telegram WebApp
            if (window.Telegram && window.Telegram.WebApp) {
                return true;
            }
            
            // Проверка 2: По URL параметрам (Telegram добавляет эти параметры)
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('tgWebAppData') || urlParams.has('tgWebAppVersion')) {
                return true;
            }
            
            // Проверка 3: По user agent
            const userAgent = navigator.userAgent.toLowerCase();
            if (userAgent.includes('telegram') || userAgent.includes('webview')) {
                return true;
            }
            
            return false;
        }
        
        // Получаем username из Telegram или других источников
        function getUsername() {
            let username = 'Игрок';
            
            // Пробуем получить из Telegram
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    const user = tg.initDataUnsafe.user;
                    
                    // Используем username, если есть
                    if (user.username) {
                        username = user.username;
                    }
                    // Или имя и фамилию
                    else if (user.first_name) {
                        username = user.first_name;
                        if (user.last_name) {
                            username += ' ' + user.last_name;
                        }
                    }
                }
            }
            
            // Пробуем получить из URL параметров
            const urlParams = new URLSearchParams(window.location.search);
            const usernameFromUrl = urlParams.get('username');
            if (usernameFromUrl) {
                username = usernameFromUrl;
            }
            
            // Пробуем получить из localStorage
            const usernameFromStorage = localStorage.getItem('username');
            if (usernameFromStorage) {
                username = usernameFromStorage;
            }
            
            return username;
        }
        
        // Переход на главную страницу
        function goToMain() {
            const username = getUsername();
            
            // Сохраняем username в localStorage
            localStorage.setItem('username', username);
            
            // Простой переход на main.html
            window.location.href = 'main.html';
        }
        
        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            const isTelegram = isTelegramWebApp();
            const username = getUsername();
            
            // Обновляем интерфейс
            document.getElementById('welcomeText').textContent = `Привет, ${username}!`;
            document.getElementById('descriptionText').textContent = 'Добро пожаловать в приложение';
            
            // Показываем индикатор Telegram, если запущено в нем
            if (isTelegram) {
                document.getElementById('telegramIndicator').style.display = 'block';
                
                // Инициализируем Telegram WebApp
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    
                    // Расширяем на весь экран
                    tg.expand();
                    
                    // Можно настроить кнопку Telegram
                    tg.MainButton.setText('Продолжить').show().onClick(function() {
                        goToMain();
                    });
                    
                    // Скрываем нашу кнопку, используем Telegram кнопку
                    document.getElementById('continueButton').style.display = 'none';
                }
            }
            
            // Обработчик кнопки "Продолжить"
            document.getElementById('continueButton').addEventListener('click', goToMain);
            
            // Автоматический переход через 3 секунды
            setTimeout(goToMain, 3000);
            
            // Обработчик ошибки загрузки гифки
            document.getElementById('userIcon').onerror = function() {
                this.style.display = 'none';
                const altDiv = document.createElement('div');
                altDiv.textContent = '👋';
                altDiv.style.fontSize = '60px';
                altDiv.style.marginBottom = '25px';
                document.body.insertBefore(altDiv, document.querySelector('h1'));
            };
        });
    </script>
</body>
</html>
